name: score_stats
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.1
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  palette_generator: ^0.3.3+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # ✅ BƯỚC 1: THÊM THƯ VIỆN CẮT LOGO
  flutter_launcher_icons: ^0.13.1

# ✅ BƯỚC 2: CẤU HÌNH LOGO CHO ANDROID VÀ IOS
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_logo.png" # Đảm bảo bạn đã bỏ ảnh vào đúng đường dẫn này
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    # ✅ BƯỚC 3: KHAI BÁO THƯ MỤC CHỨA ẢNH LOGO VỚI FLUTTER
    - assets/icon/